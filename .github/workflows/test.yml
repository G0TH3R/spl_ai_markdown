name: test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest tools.ai_markdown_python.test_core tools.ai_markdown_python.test_command -v
      - run: node tools/ai_markdown_python/test_ui.js
      - run: python3 tools/ai_markdown_python/verify_and_package.py
